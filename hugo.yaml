params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Backend Dev Story
  description: "Learning Series of Scaling Backend System"
  keywords: [Blog, Backend, Scaling]
  author: Gary Samaita
  # author: ["Me", "You"] # multiple authors
