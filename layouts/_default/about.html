{{- define "main" }}
<article class="about-page">
  <header class="about-hero">
    {{- partial "breadcrumbs.html" . }}
    <p class="about-hero__eyebrow">System Performance Engineer</p>
    <h1>{{ .Title }}</h1>
    <p class="about-hero__description">{{ .Description }}</p>
  </header>

  <div class="about-page__body md-content">
    {{ .Content }}
  </div>
</article>
{{- end }}
