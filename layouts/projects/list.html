{{- define "main" }}
<header class="projects-header">
  {{- partial "breadcrumbs.html" . }}
  <h1>{{ .Title }}</h1>
  {{- with .Description }}<p>{{ . }}</p>{{ end }}
</header>
<div class="project-grid project-grid--index">
  {{- range sort hugo.Data.projects "weight" "asc" }}
    {{ partial "project-card.html" (dict "project" .) }}
  {{- end }}
</div>
{{- end }}
